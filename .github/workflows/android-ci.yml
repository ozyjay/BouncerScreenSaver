name: Android CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    # Keep CI emulator-free by limiting the default workflow to host-side checks.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Assemble debug
        run: ./gradlew assembleDebug
